<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#0f172a;--muted:#718096;--line:#e7edf4;--nav:#09111f;--nav2:#111d31;--accent:#6366f1;--cyan:#06b6d4;--green:#16a34a;--amber:#f59e0b;--red:#ef4444;--shadow:0 12px 35px rgba(15,23,42,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}
aside{position:fixed;z-index:20;inset:0 auto 0 0;width:252px;background:linear-gradient(180deg,#08101e,#0d192b);color:#cbd5e1;padding:20px 13px;transition:.25s;width:252px;box-shadow:12px 0 35px rgba(2,6,23,.12)}
aside.collapsed{width:76px}.brand{display:flex;align-items:center;gap:12px;padding:3px 9px 24px}.mark{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#22c55e);color:#fff;font-weight:900;box-shadow:0 9px 25px #6366f133}.brand b{color:#fff;font-size:19px}.brand small{display:block;color:#64748b;font-size:9px;letter-spacing:1.4px;margin-top:2px}.collapsed .brandText,.collapsed .navText,.collapsed .sideFoot{display:none}.toggle{position:absolute;right:-14px;top:30px;border:1px solid #334155;background:#172235;color:#fff;width:29px;height:29px;border-radius:50%}.collapsed .toggle{transform:rotate(180deg)}
.nav{display:grid;gap:4px}.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:#9fb0c8;text-decoration:none;font-size:13px;transition:.18s}.nav a:hover,.nav a.active{background:linear-gradient(90deg,#1a2944,#132238);color:#fff}.nav a.active:before{content:"";position:absolute;left:-13px;width:3px;height:21px;border-radius:0 4px 4px 0;background:var(--accent)}.ico{width:19px;text-align:center;flex:none}.collapsed .nav a{justify-content:center}.collapsed .navText{display:none}.collapsed .nav a:hover:after{content:attr(data-tip);position:absolute;left:63px;top:7px;background:#111827;color:#fff;padding:7px 10px;border-radius:8px;white-space:nowrap;z-index:50}.sideFoot{position:absolute;bottom:20px;left:20px;color:#667892;font-size:10px;display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
main{margin-left:252px;padding:24px 30px 50px;max-width:1550px;transition:.25s}.collapsed+main{margin-left:76px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:800;color:#8794a8}.top h2{margin:4px 0 0;font-size:27px;letter-spacing:-.7px}.topRight{display:flex;gap:9px;align-items:center}.search{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:210px;outline:none}.date{font-size:12px;color:#718096;background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:10px}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#101827,#172554 58%,#0f766e 130%);color:#fff;border-radius:22px;padding:28px 30px;margin-bottom:18px;box-shadow:0 16px 40px rgba(17,24,39,.12)}.hero:after{content:"";position:absolute;right:-70px;top:-150px;width:270px;height:270px;border:50px solid #ffffff0d;border-radius:50%}.hero h1{position:relative;z-index:1;margin:0 0 7px;font-size:29px}.hero p{position:relative;z-index:1;margin:0;color:#cbd5e1;font-size:13px}.hero .badge{position:absolute;right:25px;bottom:20px;color:#a7f3d0;background:#ffffff0d;border-radius:20px;padding:7px 10px;font-size:10px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 2px 8px rgba(15,23,42,.025);transition:.18s}.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.kpi .lab{font-size:10px;letter-spacing:.7px;color:#8090a5;font-weight:800}.kpi .val{font-size:22px;font-weight:850;margin-top:7px}.up{font-size:10px;color:var(--green);margin-top:6px}.warn{color:var(--amber)}
.trading{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:14px 0}.trade{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;display:flex;justify-content:space-between;align-items:center}.trade .num{font-size:21px;font-weight:850}.trade small{display:block;color:#94a3b8;margin-top:3px}.bar{width:105px;height:7px;background:#edf2f7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#22c55e);border-radius:9px}
.content{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.panelHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.panel h3{margin:0;font-size:15px}.muted{color:#718096;font-size:11px}.btn{border:0;border-radius:9px;background:#eef2ff;color:#4f46e5;padding:8px 11px;font-size:11px;font-weight:750}.btn.dark{background:#111827;color:#fff}.btn.green{background:#ecfdf5;color:#15803d}.btn.red{background:#fef2f2;color:#b91c1c}.list{display:grid}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #eef2f7}.row:last-child{border-bottom:0}.row b{font-size:12px}.row small{display:block;color:#7b8798;margin-top:4px;font-size:10px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800;white-space:nowrap}.pGreen{background:#ecfdf5;color:#15803d}.pAmber{background:#fffbeb;color:#b45309}.pBlue{background:#eef2ff;color:#4338ca}.pRed{background:#fef2f2;color:#b91c1c}.pGray{background:#f1f5f9;color:#64748b}
.moduleHead{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}.moduleHead h1{margin:3px 0 4px;font-size:25px}.moduleActions{display:flex;gap:8px}.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}.tableWrap{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th{text-align:left;background:#f8fafc;color:#718096;font-size:10px;letter-spacing:.7px;padding:12px 14px}.table td{padding:14px;border-top:1px solid #eef2f7;font-size:12px}.table tr:hover td{background:#fafcff}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:center}.flowBox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.flowBox b{font-size:12px}.flowBox small{display:block;color:#94a3b8;font-size:9px;margin-top:5px}.arrow{text-align:center;color:#94a3b8}.empty{padding:35px;text-align:center;color:#94a3b8}.notice{padding:13px 15px;border-radius:12px;background:#eef2ff;color:#4338ca;font-size:11px;margin-bottom:13px}
@media(max-width:1100px){.grid6{grid-template-columns:repeat(3,1fr)}.content{grid-template-columns:1fr}.statGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){aside{width:76px}.brandText,.navText,.sideFoot{display:none}main{margin-left:76px;padding:16px}.grid6,.trading,.statGrid{grid-template-columns:1fr 1fr}.topRight .search{display:none}.moduleHead{align-items:flex-start;gap:10px;flex-direction:column}.flow{grid-template-columns:1fr}.arrow{display:none}}
</style>

<script>
const deals=[
["D-001245","E250 Plate","ABC Steel Ltd.","XYZ Industries","20 MT","₹35/kg","₹50/kg","Committed","Seller + Buyer"],
["D-001246","HR Coil","PQR Engineering","Buyer TBD","40 MT","₹40/kg","—","Opportunity","Seller only"],
["D-001247","MS Plate","Direct Corporate","LMN Industries","100 MT","₹52/kg","₹55/kg","In Execution","Seller + Buyer"]
];
const opps=[
["OP-1001","E250 Plate","ABC Steel Ltd.","20 MT","₹35/kg","₹48–52/kg","Hot","Surplus / Dead Stock"],
["OP-1002","HR Coil","PQR Engineering","40 MT","₹40/kg","₹45–49/kg","Open","Surplus / Dead Stock"],
["OP-1003","MS Plate","Direct Corporate","100 MT","₹52/kg","₹54–56/kg","Open","Direct Corporate"],
["OP-1004","GI Sheet","Factory Source","60 MT","₹61/kg","₹68–70/kg","Watch","Surplus / Dead Stock"]
];
const navNames={dashboard:"Dashboard",intelligence:"Market Intelligence",opportunities:"Material Opportunities",demands:"Buyer Demands",deals:"Deal Management",procurement:"Procurement",inventory:"Inventory",sales:"Sales & Dispatch",buyers:"Customers & Buyers",sellers:"Sellers & Suppliers",materials:"Material Master",warehouses:"Warehouses",payments:"Payments",reports:"Reports",documents:"Documents",company:"Company & Users"};
function toggleSide(){document.getElementById("side").classList.toggle("collapsed")}
function k(label,val,sub,cls=""){return '<div class="kpi"><div class="lab">'+label+'</div><div class="val">'+val+'</div><div class="up '+cls+'">'+sub+'</div></div>'}
function moduleHead(title,desc,button="New Record"){return '<div class="moduleHead"><div><div class="eyebrow">ERP MODULE</div><h1>'+title+'</h1><div class="muted">'+desc+'</div></div><div class="moduleActions"><button class="btn" onclick="alert(\'UI action ready — backend integration comes next.\')">'+button+'</button></div></div>'}
function table(headers,rows){return '<div class="tableWrap"><table class="table"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function dashboard(){return '<div class="top"><div><div class="eyebrow">CONTROL CENTER</div><h2>Trading Operations</h2></div><div class="topRight"><input class="search" placeholder="Search ERP..." onkeydown="if(event.key===\'Enter\'){alert(\'Global search UI ready\')}"><div class="date">21 Sep 2026 • Live</div></div></div><section class="hero"><h1>Good morning, Mayank.</h1><p>Track supply, buyer demand, deals, stock and profitability from one centralized system.</p><span class="badge">● SYSTEM ONLINE</span></section><div class="grid6">'+k("Open Deals","24","↑ 6 this week")+k("Opportunities","41","14 hot signals")+k("Buyer Demands","36","9 urgent")+k("Inventory Value","₹8.4 Cr","↑ 4.8%")+k("Receivables","₹2.1 Cr","12 invoices open","warn")+k("Payables","₹1.3 Cr","8 invoices open")+'</div><div class="trading"><div class="trade"><div><div class="lab">TODAY PURCHASE</div><div class="num">₹18.5L</div><small>6 transactions</small></div><div class="bar"><i style="width:68%"></i></div></div><div class="trade"><div><div class="lab">TODAY SALES</div><div class="num">₹26.2L</div><small>8 transactions</small></div><div class="bar"><i style="width:82%"></i></div></div><div class="trade"><div><div class="lab">TODAY PROFIT</div><div class="num">₹4.1L</div><small>15.6% blended margin</small></div><div class="bar"><i style="width:74%"></i></div></div></div><div class="content"><section class="panel"><div class="panelHead"><h3>Priority Deals</h3><button class="btn" onclick="location.hash=\'deals\'">View all</button></div><div class="list">'+deals.map(d=>'<div class="row"><div><b>'+d[0]+' • '+d[1]+'</b><small>'+d[2]+' → '+d[3]+' • '+d[4]+' • Buy '+d[5]+' → Sell '+d[6]+'</small></div><span class="pill '+(d[7]=="Committed"?"pGreen":d[7]=="Opportunity"?"pAmber":"pBlue")+'">'+d[7]+'</span></div>').join('')+'</div></section><section class="panel"><div class="panelHead"><h3>Action Center</h3><span class="muted">Needs attention</span></div><div class="list"><div class="row"><div><b>4 deals have capital exposure</b><small>Seller committed, buyer not yet confirmed.</small></div><span class="pill pRed">EXPOSURE</span></div><div class="row"><div><b>9 urgent buyer demands</b><small>Match against live supply signals.</small></div><span class="pill pAmber">URGENT</span></div><div class="row"><div><b>12 receivables pending</b><small>Review due dates and collection status.</small></div><span class="pill pBlue">PAYMENTS</span></div></div></section></div>'}
function intelligence(){return moduleHead("Market Intelligence","Convert market signals into structured supply, demand and pricing intelligence.","Add Signal")+ '<div class="statGrid">'+k("Supply Signals","41","Active opportunities")+k("Buyer Signals","36","Open demands")+k("Price Records","128","Last 30 days")+k("Matches","17","Potential matches")+'</div><div class="notice">SOURCE → MATERIAL → QUANTITY → MARKET RATE → BUYER DEMAND → MATCH → DEAL</div>'+table(["Signal","Company","Material","Qty","Rate","Type","Status"],[["MI-2201","ABC Steel Ltd.","E250 Plate","20 MT","₹48–52/kg","Supply","Hot"],["MI-2202","PQR Engineering","HR Coil","40 MT","₹45–49/kg","Supply","Open"],["MI-2203","XYZ Industries","E250 Plate","20 MT","Target ₹50/kg","Demand","Urgent"],["MI-2204","LMN Industries","MS Plate","100 MT","Target ₹55/kg","Demand","Open"]].map(r=>r.map((x,i)=>i===6?'<span class="pill pGreen">'+x+'</span>':x)))}
function opportunities(){return moduleHead("Material Opportunities","Seller-side surplus, dead-stock and corporate purchase opportunities.","Add Opportunity")+'<div class="statGrid">'+k("Total","41","Open supply signals")+k("Hot","14","Needs quick action")+k("Open","18","Not yet converted")+k("Watch","9","Monitoring")+'</div>'+table(["ID","Material","Seller / Source","Qty","Asking","Market","Status","Source Type"],opps.map(r=>r.map((x,i)=>i===6?'<span class="pill '+(x==="Hot"?"pRed":x==="Open"?"pGreen":"pAmber")+'">'+x+'</span>':x)))}
function demands(){return moduleHead("Buyer Demands","Capture what buyers need before matching supply.","Add Demand")+'<div class="statGrid">'+k("Open Demands","36","Active buyer requirements")+k("Urgent","9","Required soon")+k("Matched","17","Linked to supply")+k("Unmatched","19","Needs sourcing")+'</div>'+table(["Demand","Buyer","Material","Qty","Target Rate","Required By","Status"],[["DM-3001","XYZ Industries","E250 Plate","20 MT","₹50/kg","25 Sep 2026","Urgent"],["DM-3002","LMN Industries","MS Plate","100 MT","₹55/kg","30 Sep 2026","Open"],["DM-3003","Steel Consumer A","HR Coil","60 MT","₹48/kg","05 Oct 2026","Open"]].map(r=>r.map((x,i)=>i===6?'<span class="pill '+(x==="Urgent"?"pAmber":"pGreen")+'">'+x+'</span>':x)))}
function dealsPage(){return moduleHead("Deal Management","Central business object linking seller, material, purchase, stock, buyer, sale and profit.","Create Deal")+'<div class="statGrid">'+k("Open Deals","24","All active")+k("Seller Committed","12","Supply locked")+k("Buyer Committed","7","Demand locked")+k("Capital Exposure","4","Seller only")+'</div>'+table(["Deal","Material","Seller","Buyer","Qty","Buy","Sell","Status","Commitment"],deals.map(r=>r.map((x,i)=>i===7?'<span class="pill '+(x==="Committed"?"pGreen":x==="Opportunity"?"pAmber":"pBlue")+'">'+x+'</span>':x)))}
function generic(title,desc,headers,rows,stats){return moduleHead(title,desc)+(stats?'<div class="statGrid">'+stats.map(s=>k(s[0],s[1],s[2])).join('')+'</div>':'')+table(headers,rows)}
function render(){
 let key=location.hash.slice(1)||"dashboard"; if(!navNames[key]) key="dashboard";
 document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+key));
 let content;
 if(key==="dashboard")content=dashboard();
 else if(key==="intelligence")content=intelligence();
 else if(key==="opportunities")content=opportunities();
 else if(key==="demands")content=demands();
 else if(key==="deals")content=dealsPage();
 else if(key==="procurement")content=generic("Procurement","Record purchases from surplus sellers, corporate sources and regular suppliers.",["Purchase","Type","Seller","Material","Qty","Buy Rate","Status"],[["PO-8001","Surplus / Dead Stock","ABC Steel Ltd.","E250 Plate","20 MT","₹35/kg","Received"],["PO-8002","Direct Corporate","Direct Corporate","MS Plate","100 MT","₹52/kg","In Transit"],["PO-8003","Regular Supplier","Steel Supplier A","HR Coil","40 MT","₹41/kg","Draft"]],[["Today Purchase","₹18.5L","6 transactions"],["Pending Receipts","8","Shipments"],["Capital Blocked","₹32L","Incoming stock"],["Vendors","86","Active sources"]]);
 else if(key==="inventory")content=generic("Inventory","Central stock ledger with source, cost, location, reservation and deal linkage.",["Stock","Material","Warehouse","Qty","Cost","Status","Linked Deal"],[["ST-4401","E250 Plate","Main Yard","20 MT","₹35/kg","Reserved","D-001245"],["ST-4402","MS Plate","Main Yard","100 MT","₹52/kg","Available","D-001247"],["ST-4403","HR Coil","Transit Yard","40 MT","₹40/kg","Incoming","D-001246"]],[["Available","₹5.8 Cr","Current stock"],["Reserved","₹1.4 Cr","Committed"],["Incoming","₹1.2 Cr","In transit"],["Blocked","₹18L","Exceptions"]]);
 else if(key==="sales")content=generic("Sales & Dispatch","Buyer orders, allocation, dispatch and delivery tracking.",["Order","Buyer","Material","Qty","Sell Rate","Dispatch","Status"],[["SO-6101","XYZ Industries","E250 Plate","20 MT","₹50/kg","24 Sep","Ready"],["SO-6102","LMN Industries","MS Plate","100 MT","₹55/kg","26 Sep","Planned"],["SO-6103","Buyer B","HR Coil","15 MT","₹49/kg","22 Sep","Dispatched"]],[["Today Sales","₹26.2L","8 orders"],["Ready","₹14.8L","Dispatch queue"],["Dispatched","₹7.4L","On route"],["Delivered","₹4.0L","Completed"]]);
 else if(key==="buyers")content=generic("Customers & Buyers","Companies that consume materials, place requirements and purchase from you.",["Buyer","City","Active Demands","Last Purchase","Credit","Status"],[["XYZ Industries","Panipat","4","18 Sep 2026","₹42L","Active"],["LMN Industries","Rohtak","3","16 Sep 2026","₹28L","Active"],["Steel Consumer A","Haryana","2","08 Sep 2026","₹15L","Active"],["Buyer B","Delhi NCR","1","02 Sep 2026","₹9L","Active"]],[["Total Buyers","184","Master records"],["Active","137","Trading regularly"],["Open Demands","36","Requirements"],["Receivables","₹2.1 Cr","Outstanding"]]);
 else if(key==="sellers")content=generic("Sellers & Suppliers","Factories, surplus holders and regular suppliers who can provide material.",["Seller","City","Supply Signals","Last Purchase","Reliability","Status"],[["ABC Steel Ltd.","Haryana","8","18 Sep 2026","High","Active"],["PQR Engineering","Panipat","5","12 Sep 2026","Medium","Active"],["Steel Supplier A","Delhi NCR","11","10 Sep 2026","High","Active"],["Factory Source","Rohtak","3","05 Sep 2026","New","Active"]],[["Total Sources","96","Seller records"],["Surplus Sources","61","Dead-stock holders"],["Active Signals","41","Current supply"],["Payables","₹1.3 Cr","Outstanding"]]);
 else if(key==="materials")content=generic("Material Master","Standardized material, grade, specification, unit and market classification.",["Code","Material","Grade","Specification","Unit","Active"],[["MAT-001","E250 Plate","E250","IS 2062","KG","Yes"],["MAT-002","HR Coil","IS 2062","Hot Rolled","KG","Yes"],["MAT-003","MS Plate","IS 2062","Commercial","KG","Yes"],["MAT-004","GI Sheet","DX51D","Galvanized","KG","Yes"]],[["Materials","428","Master records"],["Active","412","Usable"],["Grades","74","Standardized"],["Mapped","96%","Specifications"]]);
