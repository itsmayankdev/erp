<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP — Steel Trading OS</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#0f172a;--muted:#718096;--line:#e7edf4;--nav:#09111f;--nav2:#111d31;--accent:#6366f1;--cyan:#06b6d4;--green:#16a34a;--amber:#f59e0b;--red:#ef4444;--shadow:0 12px 35px rgba(15,23,42,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}
aside{position:fixed;z-index:20;inset:0 auto 0 0;width:252px;background:linear-gradient(180deg,#08101e,#0d192b);color:#cbd5e1;padding:20px 13px;transition:.25s;width:252px;box-shadow:12px 0 35px rgba(2,6,23,.12)}
aside.collapsed{width:76px}.brand{display:flex;align-items:center;gap:12px;padding:3px 9px 24px}.mark{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#22c55e);color:#fff;font-weight:900;box-shadow:0 9px 25px #6366f133}.brand b{color:#fff;font-size:19px}.brand small{display:block;color:#64748b;font-size:9px;letter-spacing:1.4px;margin-top:2px}.collapsed .brandText,.collapsed .navText,.collapsed .sideFoot{display:none}.toggle{position:absolute;right:-14px;top:30px;border:1px solid #334155;background:#172235;color:#fff;width:29px;height:29px;border-radius:50%}.collapsed .toggle{transform:rotate(180deg)}
.nav{display:grid;gap:4px}.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:#9fb0c8;text-decoration:none;font-size:13px;transition:.18s}.nav a:hover,.nav a.active{background:linear-gradient(90deg,#1a2944,#132238);color:#fff}.nav a.active:before{content:"";position:absolute;left:-13px;width:3px;height:21px;border-radius:0 4px 4px 0;background:var(--accent)}.ico{width:19px;text-align:center;flex:none}.collapsed .nav a{justify-content:center}.collapsed .navText{display:none}.collapsed .nav a:hover:after{content:attr(data-tip);position:absolute;left:63px;top:7px;background:#111827;color:#fff;padding:7px 10px;border-radius:8px;white-space:nowrap;z-index:50}.sideFoot{position:absolute;bottom:20px;left:20px;color:#667892;font-size:10px;display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
main{margin-left:252px;padding:24px 30px 50px;max-width:1550px;transition:.25s}.collapsed+main{margin-left:76px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:800;color:#8794a8}.top h2{margin:4px 0 0;font-size:27px;letter-spacing:-.7px}.topRight{display:flex;gap:9px;align-items:center}.search{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:210px;outline:none}.date{font-size:12px;color:#718096;background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:10px}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#101827,#172554 58%,#0f766e 130%);color:#fff;border-radius:22px;padding:28px 30px;margin-bottom:18px;box-shadow:0 16px 40px rgba(17,24,39,.12)}.hero:after{content:"";position:absolute;right:-70px;top:-150px;width:270px;height:270px;border:50px solid #ffffff0d;border-radius:50%}.hero h1{position:relative;z-index:1;margin:0 0 7px;font-size:29px}.hero p{position:relative;z-index:1;margin:0;color:#cbd5e1;font-size:13px}.hero .badge{position:absolute;right:25px;bottom:20px;color:#a7f3d0;background:#ffffff0d;border-radius:20px;padding:7px 10px;font-size:10px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 2px 8px rgba(15,23,42,.025);transition:.18s}.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.kpi .lab{font-size:10px;letter-spacing:.7px;color:#8090a5;font-weight:800}.kpi .val{font-size:22px;font-weight:850;margin-top:7px}.up{font-size:10px;color:var(--green);margin-top:6px}.warn{color:var(--amber)}
.trading{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:14px 0}.trade{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;display:flex;justify-content:space-between;align-items:center}.trade .num{font-size:21px;font-weight:850}.trade small{display:block;color:#94a3b8;margin-top:3px}.bar{width:105px;height:7px;background:#edf2f7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#22c55e);border-radius:9px}
.content{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.panelHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.panel h3{margin:0;font-size:15px}.muted{color:#718096;font-size:11px}.btn{border:0;border-radius:9px;background:#eef2ff;color:#4f46e5;padding:8px 11px;font-size:11px;font-weight:750}.btn.dark{background:#111827;color:#fff}.btn.green{background:#ecfdf5;color:#15803d}.btn.red{background:#fef2f2;color:#b91c1c}.list{display:grid}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #eef2f7}.row:last-child{border-bottom:0}.row b{font-size:12px}.row small{display:block;color:#7b8798;margin-top:4px;font-size:10px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800;white-space:nowrap}.pGreen{background:#ecfdf5;color:#15803d}.pAmber{background:#fffbeb;color:#b45309}.pBlue{background:#eef2ff;color:#4338ca}.pRed{background:#fef2f2;color:#b91c1c}.pGray{background:#f1f5f9;color:#64748b}
.moduleHead{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}.moduleHead h1{margin:3px 0 4px;font-size:25px}.moduleActions{display:flex;gap:8px}.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}.tableWrap{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th{text-align:left;background:#f8fafc;color:#718096;font-size:10px;letter-spacing:.7px;padding:12px 14px}.table td{padding:14px;border-top:1px solid #eef2f7;font-size:12px}.table tr:hover td{background:#fafcff}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:center}.flowBox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.flowBox b{font-size:12px}.flowBox small{display:block;color:#94a3b8;font-size:9px;margin-top:5px}.arrow{text-align:center;color:#94a3b8}.empty{padding:35px;text-align:center;color:#94a3b8}.notice{padding:13px 15px;border-radius:12px;background:#eef2ff;color:#4338ca;font-size:11px;margin-bottom:13px}
@media(max-width:1100px){.grid6{grid-template-columns:repeat(3,1fr)}.content{grid-template-columns:1fr}.statGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){aside{width:76px}.brandText,.navText,.sideFoot{display:none}main{margin-left:76px;padding:16px}.grid6,.trading,.statGrid{grid-template-columns:1fr 1fr}.topRight .search{display:none}.moduleHead{align-items:flex-start;gap:10px;flex-direction:column}.flow{grid-template-columns:1fr}.arrow{display:none}}
</style>
</head>
